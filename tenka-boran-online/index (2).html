      <ul><li>前に置かれた札(酒宴・兵糧攻め・落雷)があれば、先にその結果を見る</li><li>山札から札を2枚引く</li><li>手札を好きなだけ使う(ただし斬は1回まで)</li><li>手札が体力の数より多ければ、多い分を捨てて終わり</li></ul>
      <h3>距離と「届く距離」</h3>
      <p>席が隣の人は距離1、その向こうは距離2です。斬は「届く距離」以内の相手にしか使えません。素手なら1(隣だけ)、槍なら3、火縄銃なら4まで届きます。駿馬で相手が近く、堅城で自分が遠くなります。</p>
      <h3>判定</h3>
      <p>南蛮胴・酒宴・兵糧攻め・落雷は、山札の一番上を1枚めくって、そのマーク(♠♥♣♦)と数字で結果が決まります。これを「判定」と呼びます。</p>
      <h3>倒れかけたとき</h3>
      <p>体力が0になると倒れかけます。誰かが薬を使えば助かり、誰も使わなければ討ち死にして正体が明かされます。謀反人を討った人は札を3枚もらえます。天下人がうっかり家臣を討つと、罰として手札と装備をすべて失います。</p>
      <h3>計略と看破</h3>
      <p>札には基本(斬・受・薬)、計略、装備があります。計略は看破で打ち消せます。装備や前に置かれた札は、武将の下に小さな札で表示されます。タップすると説明が出ます。</p>
      <h3>札</h3>
      <div class="tbl"><table>${rows}</table></div>
      <h3>武将</h3>
      <div class="tbl"><table>${gens}</table></div>
    </div>
    <div class="actions"><button class="btn" data-act="close">閉じる</button></div>`, true);
}
function openLog(){
  showModal('log', `<h2>軍記</h2><div class="loglist">${G.log.map(l=>`<p class="${l.cls}">${l.text}</p>`).join('')||'<p>まだ記録はありません。</p>'}</div><div class="actions"><button class="btn" data-act="close">閉じる</button></div>`, true);
}
function openTitle(){
  UI.onTitle=true; Music.mode('title');
  const st=loadStats();
  showModal('title', `
    <div class="hero"><div class="hl">
      <div class="crests">${GENERALS.map((g,i)=>portrait(g).replace('class="portrait"',`class="portrait" style="--c:${g.color};animation-delay:${i*60}ms"`)).join('')}</div>
      <div class="tlogo"><i class="seal big"><b>戦</b><b>国</b></i><img class="titleimg" src="img/title-logo.webp" alt="天下謀乱" width="1300" height="677"></div>
      <div class="sub">てんかぼうらん</div>
      <div class="catch">── 謀反人は誰だ ──</div>
      </div><div class="hr">
      <p class="lead">天下人、家臣、謀反人、内通者。<br>5人の武将が身分を隠して戦う、裏切りと推理の合戦カードゲーム。</p>
      <div class="levels" role="radiogroup" aria-label="CPUの強さ">${Object.entries(LEVELS).map(([k,l])=>`<button class="lvl ${UI.level===k?'on':''}" data-level="${k}" role="radio" aria-checked="${UI.level===k}"><b>${l.name}</b><small>${l.sub}</small></button>`).join('')}</div>
      <p class="stats lvdesc">${LEVELS[UI.level].desc}</p>
      <div class="actions"><button class="btn" data-act="new">出陣する</button>${NETC.ON?'<button class="btn" data-net="open">友達と遊ぶ</button>':''}<button class="btn ghost" data-act="rules">遊び方</button><button class="btn ghost" data-act="bgm" aria-pressed="${UI.bgm}">${UI.bgm?'曲 入':'曲 切'}</button><button class="btn ghost" data-act="sound" aria-pressed="${UI.sound}">${UI.sound?'効果音 入':'効果音 切'}</button></div>
      ${st.plays?`<p class="stats">〈${LEVELS[UI.level].name}〉この端末の戦績 ${st.wins}勝 / ${st.plays}戦</p>`:'<p class="stats">相手はCPU4人。1戦およそ10分。</p>'}
      <p class="stats" style="font-size:11px;opacity:.75">BGM:HRTa ・ 題字:莫大毛筆(SIL OFL 1.1)を改変</p>
    </div></div>`, true);
  TitleEmbers.attach();
}
function copyShare(btn){
  const text=shareText();
  const done=()=>{ btn.textContent='コピーしました'; };
  const fallback=()=>{ const el=document.getElementById('share-text'); if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent='選択しました。コピーしてください'; } };
  try{ navigator.clipboard.writeText(text).then(done, fallback); }catch(e){ fallback(); }
}

/* ===================== イベント ===================== */
function newGame(){
  if(NETC.active) return NETC.restart();
  if(G) G.aborted=true;
  if(UI.pending){ const p=UI.pending; UI.pending=null; p.reject(new Stop('abort')); }
  UI.onTitle=false;
  closeModal(); if($fx) $fx.innerHTML='';
  runGame(0, UI.level).catch(e=>{ if(!(e instanceof Stop)) console.error(e); });
}
if(!HEADLESS){
  document.addEventListener('click', e=>{
    const gpick=e.target.closest('[data-guesspick]');
    if(gpick){ const v=gpick.dataset.guesspick, st=+gpick.dataset.seat; guessOf(st); if(v) UI.guess[st]=v; else delete UI.guess[st]; closeGuess(); return render(); }
    const gEl=e.target.closest('[data-guess]');
    if(gEl){ e.preventDefault(); return openGuess(gEl); }
    if(!e.target.closest('.gpop')) closeGuess();
    if(NETC.click(e)) return;
    const miniEl=e.target.closest('[data-mini]');
    if(miniEl){ const d=CARD_DEFS[miniEl.dataset.mini]; const k=miniEl.dataset.kind==='jd'?'前に置かれた札':'装備'; showTip(miniEl, `<b>${d.name}</b><small>${k}</small><p>${d.desc}</p>`); return; }
    if(!e.target.closest('.tip')){ const t=$fx&&$fx.querySelector('.tip'); if(t) t.remove(); }
    const lvEl=e.target.closest('[data-level]');
    if(lvEl){ UI.level=lvEl.dataset.level; try{localStorage.setItem('sengoku-satsu-level',UI.level);}catch(_){} return openTitle(); }
    const actEl=e.target.closest('[data-act]');
    if(actEl){
      const a=actEl.dataset.act;
      if(a==='new'){ ac(); return newGame(); }
      if(a==='bgm'){ UI.bgm=!UI.bgm; try{localStorage.setItem('sengoku-satsu-bgm',UI.bgm?'1':'0');}catch(_){} if(UI.bgm) Music.resume(); else Music.stop(); return UI.onTitle ? openTitle() : render(); }
      if(a==='rules') return openRules();
      if(a==='log') return openLog();
      if(a==='result') return openResultModal();
      if(a==='copy') return copyShare(actEl);
      if(a==='close'){ const sp=UI.pending&&UI.pending.spec; closeModal(); if(sp&&(sp.mode==='general'||sp.mode==='zone'||sp.mode==='victim'||sp.mode==='harvest')) render(); else if(NETC.active && (!G.started||G.over)) NETC.showLobby(); else if(!G.started) openTitle(); return; }
      if(a==='sound'){ UI.sound=!UI.sound; try{localStorage.setItem('sengoku-satsu-sound',UI.sound?'1':'0');}catch(_){} if(UI.sound){ SFX.load(); sfx.card(); } return UI.onTitle ? openTitle() : render(); }
      if(a==='speed'){ const i=SPEEDS.findIndex(x=>x.ms===UI.speed); UI.speed=SPEEDS[(i+1)%SPEEDS.length].ms; try{localStorage.setItem('sengoku-satsu-speed',String(UI.speed));}catch(_){} return render(); }
      const spec=UI.pending && UI.pending.spec; if(!spec) return;
      if(a==='end') return resolveHuman({type:'end'});
      if(a==='cancel'){ UI.selected=null; return render(); }
      if(a==='use' && UI.selected){ const c=UI.selected; const info=playInfo(G.players.find(p=>p.isHuman),c); return resolveHuman({type:'play', card:c, target:null, asKey:info.asKey}); }
      if(a==='pass') return resolveHuman(null);
      if(a==='discard' && UI.discardSel.size===spec.n) return resolveHuman([...UI.discardSel]);
      return;
    }
    const spec=UI.pending && UI.pending.spec; if(!spec) return;
    const me=G.players.find(p=>p.isHuman);
    const genEl=e.target.closest('[data-gen]');
    if(genEl && spec.mode==='general') return resolveHuman(spec.options[+genEl.dataset.gen]);
    const zoneEl=e.target.closest('[data-zone]');
    if(zoneEl && spec.mode==='zone') return resolveHuman({zone:zoneEl.dataset.zone, slot:zoneEl.dataset.slot});
    const vEl=e.target.closest('[data-victim]');
    if(vEl && spec.mode==='victim') return resolveHuman(spec.options[+vEl.dataset.victim]);
    const hEl=e.target.closest('[data-harvest]');
    if(hEl && spec.mode==='harvest') return resolveHuman(spec.pool[+hEl.dataset.harvest]);
    if(e.target.closest('.overlay')) return;
    const cardEl=e.target.closest('[data-card]');
    if(cardEl){
      const c=me.hand.find(x=>x.id===+cardEl.dataset.card); if(!c) return;
      if(spec.mode==='action'){
        if(UI.selected===c){ const info=playInfo(me,c); if(info.ok && !info.targets) return resolveHuman({type:'play', card:c, target:null, asKey:info.asKey}); UI.selected=null; }
        else UI.selected=c;
        return render();
      }
      if(spec.mode==='pick' && spec.filter(c)) return resolveHuman(c);
      if(spec.mode==='discard'){ if(UI.discardSel.has(c)) UI.discardSel.delete(c); else if(UI.discardSel.size<spec.n) UI.discardSel.add(c); return render(); }
      return;
    }
    const seatEl=e.target.closest('.seat[data-seat]');
    if(seatEl && spec.mode==='action' && UI.selected){
      const t=G.players[+seatEl.dataset.seat]; const info=playInfo(me,UI.selected);
      if(info.ok && info.targets && info.targets.includes(t)) return resolveHuman({type:'play', card:UI.selected, target:t, asKey:info.asKey});
    }
  });
  document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches('.seat.target')){ e.preventDefault(); e.target.click(); } });
  try{ if(localStorage.getItem('sengoku-satsu-bgm')==='0') UI.bgm=false; }catch(_){}
  // ブラウザは操作があるまで音を鳴らせないので、タイトル画面での最初のタップで再生を始める
  document.addEventListener('pointerdown', e=>{ SFX.load(); if(!e.target.closest('[data-act="new"],[data-act="bgm"]')) Music.resume(); });
  try{ const sp=+localStorage.getItem('sengoku-satsu-speed'); if(SPEEDS.some(x=>x.ms===sp)) UI.speed=sp; }catch(_){}
  try{ const lv=localStorage.getItem('sengoku-satsu-level'); if(lv && LEVELS[lv]) UI.level=lv; }catch(_){}
  try{ if(localStorage.getItem('sengoku-satsu-sound')==='0') UI.sound=false; }catch(_){}
  Scene.start();
  document.addEventListener('visibilitychange', ()=>{ if(!SND.ctx) return; try{ document.hidden ? SND.ctx.suspend() : SND.ctx.resume(); }catch(_){} });
  // タイトル背景用の見本盤面
  setupGame(0);
  G.players.forEach((p,i)=>{ p.role=['rebel','lord','loyal','traitor','rebel'][i]; assignGeneral(p, [GENERALS[5],GENERALS[0],GENERALS[3],GENERALS[4],GENERALS[2]][i]); draw(p,4); });
  render(); openTitle(); NETC.boot();
} else {
  globalThis.__LEVELS = LEVELS;
  globalThis.__sim = (lv, s0) => runGame(-1, lv||'normal', s0||null);
  globalThis.__state = () => G;
}
</script>
