<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="戦国武将が身分を隠して戦う、裏切りと推理の合戦カードゲーム。友達と最大5人でオンライン対戦。">
<meta property="og:title" content="戦国 天下謀乱">
<meta property="og:description" content="謀反人は誰だ。友達と遊べる戦国身分推理カードゲーム。">
<meta property="og:image" content="/img/title.webp">
<title>戦国 天下謀乱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: 夜の合戦場。上段に敵将4人の紋章、中央に「場」と山札、下段に自陣と手札。藍の夜に金箔、損害は朱。単一テーマ(夜)で統一。 */
:root{
  color-scheme:dark;
  --bg:#0c1222;          /* 夜の藍 */
  --felt:#16203a;        /* 陣幕 */
  --felt-2:#1d2a4b;
  --text:#eee6d2;
  --muted:#8e97b3;
  --line:rgba(216,178,90,.22);
  --gold:#d8b25a;        /* 金箔 */
  --gold-hi:#f3d68c;
  --gold-deep:#8a6722;
  --red:#e0503f;         /* 朱・損害 */
  --green:#63c48b;       /* 回復 */
  --paper:#f1e8d0;       /* 札の和紙 */
  --paper-2:#e3d6b4;
  --ink:#1d1b18;         /* 墨 */
  --ink-red:#a9281f;
  --ai:#2d4a92;          /* 計略の藍 */
  --f-brush:"TenkaFude","Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
/* 題字:莫大毛筆 Bold(SIL OFL 1.1)をゲームで使う文字だけに絞り、名前を変えて同梱 */
@font-face{font-family:"TenkaFude";src:url("img/tenka-fude.woff2") format("woff2");font-weight:400 900;font-display:swap;size-adjust:112%}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 70% at 50% 45%, var(--felt-2) 0%, var(--felt) 45%, var(--bg) 100%),
    var(--bg);
  color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow-x:hidden;
}
#scene,#scenefx{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
#scene{background:var(--bg)}
#scenefx{background:transparent;will-change:transform}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

.game{position:relative;z-index:1;max-width:1180px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-block:8px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@media (min-width:480px){.game{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* ── 上部バー ── */
.bar{display:flex;align-items:center;gap:8px}
.logo{font-family:var(--f-brush);font-size:26px;line-height:1;letter-spacing:.08em;color:var(--text);white-space:nowrap;display:flex;align-items:center}
.seal b{display:block;font-weight:400}
.logo span{color:var(--red)}
.seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;font-family:var(--f-brush);letter-spacing:0;
  font-size:.42em;line-height:1.02;padding:.2em .16em;margin-right:.24em;vertical-align:middle;border-radius:.12em;flex:0 0 auto;
  background:var(--ink-red);color:var(--paper);box-shadow:inset 0 0 0 .07em rgba(241,232,208,.55),0 0 0 .05em var(--ink-red)}
.info{flex:1;min-width:0;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{white-space:nowrap;flex:0 0 auto;height:32px;min-width:32px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:rgba(12,18,34,.6);font-size:12px;font-weight:700;cursor:pointer;color:var(--text)}
.ibtn:hover{border-color:var(--gold)}
.ibtn.off{color:var(--muted)}
@media (max-width:480px){.bar{gap:5px}.logo{font-size:22px}.info{display:none}.bar .logo{margin-right:auto}.ibtn{height:30px;padding:0 6px;font-size:11px}}

/* ── 紋章ポートレート ── */
.portrait{--c:#555;position:relative;width:var(--ps,56px);height:var(--ps,56px);border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%,#fff 30%) 0%, var(--c) 55%, color-mix(in srgb,var(--c) 60%,#000) 100%);
  box-shadow:0 0 0 2px var(--gold-deep),0 0 0 4px rgba(12,18,34,.9),0 0 0 5px var(--line),0 6px 14px -4px rgba(0,0,0,.7);
  display:grid;place-items:center}
.portrait::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(243,214,140,.35),inset 0 -10px 18px -6px rgba(0,0,0,.55)}
.portrait .pimg{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.portrait .kj{font-family:var(--f-brush);font-size:calc(var(--ps,56px)*.52);line-height:1;color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.portrait .badge{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-brush);font-size:14px;line-height:1;
  background:#2a3150;color:var(--muted);border:1px solid var(--line);transform:rotate(-6deg)}
.badge.lord{background:var(--gold);color:var(--ink);border-color:var(--gold-hi)}
.badge.loyal{background:var(--ai);color:var(--paper);border-color:#6b88d6}
.badge.rebel{background:var(--ink-red);color:var(--paper);border-color:var(--red)}
.badge.traitor{background:#2c6b4a;color:var(--paper);border-color:var(--green)}
.portrait .badge.guess{z-index:2;cursor:pointer;padding:0;font-family:var(--f-brush);border-style:dashed;border-color:var(--gold);color:var(--gold-hi);box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.portrait .badge.guess::after{content:"";position:absolute;inset:-9px}
.portrait .badge.guess:hover{filter:brightness(1.25)}
.badge.guess.g-loyal{background:color-mix(in srgb,var(--ai) 70%,transparent);color:var(--paper);border-color:#9fb6f0}
.badge.guess.g-rebel{background:color-mix(in srgb,var(--ink-red) 75%,transparent);color:var(--paper);border-color:#ff8a7a}
.badge.guess.g-traitor{background:color-mix(in srgb,#2c6b4a 75%,transparent);color:var(--paper);border-color:#7fd3a4}
.gpop{position:absolute;z-index:30;pointer-events:auto;padding:10px 12px;border-radius:12px;background:rgba(12,18,34,.97);border:1px solid var(--gold);box-shadow:0 10px 26px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:8px}
.gpop .gt{font-size:12.5px;color:var(--gold-hi);font-weight:700;white-space:nowrap}
.gpop .gb{display:flex;gap:6px;align-items:stretch}
.gpop .badge{position:static;transform:none;width:auto;height:auto;min-width:52px;padding:6px 6px 4px;border-radius:8px;border:1px solid;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit}
.gpop .badge span{font-family:var(--f-brush);font-size:20px;line-height:1}
.gpop .badge small{font-size:10.5px;line-height:1.2}
.gpop .badge.cur{box-shadow:0 0 0 2px var(--gold-hi)}
.gpop .gclr{border-radius:8px;border:1px solid var(--line);background:#20263c;color:var(--muted);font-size:11.5px;padding:0 9px;cursor:pointer}
.portrait .hc{position:absolute;left:-6px;top:-4px;min-width:22px;height:20px;padding:0 5px;border-radius:10px;background:var(--paper);color:var(--ink);font-size:11px;font-weight:900;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.portrait .stamp{position:absolute;inset:-4px;display:grid;place-items:center;font-family:var(--f-brush);font-size:calc(var(--ps,56px)*.55);color:var(--red);transform:rotate(-14deg);
  text-shadow:0 0 1px var(--red);opacity:.92}
.portrait .stamp::before{content:"";position:absolute;width:62%;height:62%;border:3px solid var(--red);border-radius:6px}

/* ── 敵陣 ── */
.opps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seat{--ps:58px;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:12px;text-align:center;min-width:0;
  background:linear-gradient(180deg,rgba(20,30,58,.78),rgba(8,12,24,.68));border:1px solid var(--line)}
@media (min-width:640px){.seat{--ps:78px;padding:12px 8px 10px}}
.seat .sname{font-family:var(--f-brush);font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:4px}
@media (min-width:640px){.seat .sname{font-size:19px}}
.seat .dist{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seat.active{border-color:var(--gold);background:linear-gradient(180deg,rgba(138,103,34,.35),rgba(12,18,34,.55))}
.seat.active .portrait{animation:aura 1.4s ease-in-out var(--ad14,0s) infinite}
@keyframes aura{50%{box-shadow:0 0 0 2px var(--gold-hi),0 0 0 4px rgba(12,18,34,.9),0 0 0 6px var(--gold),0 0 22px 4px rgba(216,178,90,.55)}}
.seat.target{cursor:pointer;border-color:var(--red)}
.seat.target .portrait{animation:aim 1s ease-in-out var(--ad10,0s) infinite}
@keyframes aim{50%{box-shadow:0 0 0 2px var(--red),0 0 0 4px rgba(12,18,34,.9),0 0 0 7px var(--red),0 0 20px 4px rgba(224,80,63,.6)}}
.seat.target::after{content:"狙う";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--red);color:var(--paper);font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;letter-spacing:.1em}
.seat.dead{filter:grayscale(.9) brightness(.7)}
.seat.dead .portrait .kj{opacity:.5}

.hp{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.hp i{width:9px;height:9px;display:block;background:var(--red);transform:rotate(45deg) scale(.78);box-shadow:0 0 4px rgba(224,80,63,.6)}
.hp i.off{background:transparent;box-shadow:none;border:1px solid rgba(142,151,179,.5)}
.eqs{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:16px}
.fan{position:relative;height:44px;width:100%;margin-top:4px;display:flex;justify-content:center}
.fan i{position:absolute;left:50%;bottom:1px;width:23px;height:33px;margin-left:-11.5px;border-radius:3px;transform-origin:50% 140%;
  background:url("img/back.webp") center/cover no-repeat,var(--ai);border:1.5px solid var(--gold);box-shadow:0 2px 5px rgba(0,0,0,.75),inset 0 0 0 1px rgba(0,0,0,.4)}
.fan b{position:absolute;left:50%;top:-6px;margin-left:22px;min-width:22px;height:20px;padding:0 5px;border-radius:10px;background:var(--paper);color:var(--ink);font-size:13px;line-height:20px;z-index:1;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.fan.empty{align-items:flex-end}
.fan.empty span{font-size:10.5px;color:var(--muted)}
@media (min-width:640px){.fan{height:58px}.fan i{width:32px;height:46px;margin-left:-16px}.fan b{margin-left:32px;font-size:14px}}
.say{position:fixed;z-index:17;left:0;top:0;transform:translate(-50%,0);padding:6px 13px 7px;border-radius:14px;white-space:nowrap;pointer-events:none;
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);font-family:var(--f-brush);font-size:18px;line-height:1.2;box-shadow:0 5px 12px rgba(0,0,0,.6)}
.say::before{content:"";position:absolute;left:var(--tail,50%);top:-8px;width:12px;height:12px;margin-left:-7px;background:var(--paper);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.say.up::before{top:auto;bottom:-8px;transform:rotate(225deg)}
.say.hot{color:var(--ink-red);border-color:var(--ink-red);font-size:20px}
.say.hot::before{border-color:var(--ink-red)}
.say.good{color:#1f6a40;border-color:#2a7048}
.say.good::before{border-color:#2a7048}
@media (max-width:480px){.say{font-size:15px;padding:5px 10px}.say.hot{font-size:17px}}
.cutin{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);height:clamp(230px,40vw,340px);display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,40px);padding:0 max(16px,env(safe-area-inset-left,0px));z-index:18}
.cutin .ci-band{position:absolute;left:-5%;right:-5%;top:0;bottom:0;transform:skewY(-6deg);transform-origin:left center;
  background:linear-gradient(90deg,rgba(9,13,26,.96),rgba(30,22,10,.96) 50%,rgba(9,13,26,.96));border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);box-shadow:0 0 40px rgba(0,0,0,.8)}
.cutin .ci-p{--ps:clamp(110px,30vw,180px);position:relative}
.cutin .ci-p .portrait{box-shadow:0 0 0 3px var(--gold-hi),0 0 0 7px rgba(12,18,34,.9),0 0 0 9px var(--gold),0 0 40px rgba(243,214,140,.4)}
.cutin .ci-t{position:relative;display:flex;flex-direction:column;gap:4px;max-width:min(520px,52vw);min-width:0}
.cutin .ci-ep{font-size:12px;letter-spacing:.3em;color:var(--gold)}
.cutin b{font-family:var(--f-brush);font-weight:400;font-size:clamp(24px,6vw,36px);line-height:1.1;color:var(--gold-hi)}
.cutin q{font-family:var(--f-brush);font-size:clamp(17px,4.4vw,28px);line-height:1.45;color:var(--paper);quotes:"「" "」";text-wrap:balance}
.cutin small{font-size:11px;color:var(--muted)}
.pq{font-family:var(--f-brush);font-size:14px;line-height:1.5;color:var(--paper);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.pq small{display:block;font-family:var(--f-body);font-size:10.5px;color:var(--muted)}
.rquote{font-family:var(--f-brush);font-size:16px;line-height:1.5;color:var(--paper);max-width:30em;text-wrap:balance}
.rquote small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);margin-top:2px}
.is-lose .rquote{text-shadow:0 1px 4px #000}
.flyback{position:fixed;z-index:16;width:34px;height:49px;border-radius:4px;background:url("img/back.webp") center/cover no-repeat,var(--ai);border:1px solid var(--gold);box-shadow:0 4px 10px rgba(0,0,0,.6)}
.jz{display:flex;gap:3px;justify-content:center}
.jc{font-family:var(--f-brush);font-size:12px;line-height:1;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 8px rgba(0,0,0,.6)}
.jc.j-shuen{background:#9b2c4b}.jc.j-hyourou{background:#6b5a22}.jc.j-rakurai{background:#2d4a92;box-shadow:0 0 0 1px #f3d68c,0 0 10px rgba(243,214,140,.6)}
.minis{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:0;margin-top:2px}
.minis.empty{display:none}
.mini{--mw:34px;position:relative;width:var(--mw);height:calc(var(--mw)*1.36);padding:0;border-radius:4px;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(160deg,var(--paper),var(--paper-2));border:1px solid var(--gold);box-shadow:0 2px 5px rgba(0,0,0,.7);overflow:hidden}
.mini img{position:absolute;left:2px;right:2px;top:2px;bottom:12px;width:calc(100% - 4px);height:calc(100% - 14px);object-fit:contain}
.mini b{position:absolute;left:0;right:0;bottom:0;height:12px;line-height:12px;font-size:8.5px;font-weight:700;color:var(--paper);background:var(--gold-deep);text-align:center;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.mini i{position:absolute;top:1px;right:1px;min-width:12px;height:12px;border-radius:6px;background:var(--ink);color:var(--gold-hi);font-style:normal;font-size:9px;line-height:12px;font-weight:900;text-align:center}
.mini.jd{border-color:var(--red);transform:rotate(-7deg);box-shadow:0 0 0 1px var(--red),0 0 10px rgba(224,80,63,.55)}
.mini.jd b{background:var(--ink-red)}
.mini.jd.k-rakurai{border-color:#f3d68c;box-shadow:0 0 0 1px #f3d68c,0 0 12px rgba(243,214,140,.7)}
.mini.jd.k-rakurai b{background:var(--ai)}
.mini:hover{transform:translateY(-2px)}
.mini.jd:hover{transform:rotate(-7deg) translateY(-2px)}
.mini:focus-visible{outline:2px solid var(--gold-hi)}
@media (min-width:640px){.seat .mini{--mw:40px}.mini b{font-size:9.5px}}
.me .minis{justify-content:flex-start}
.tip{position:fixed;z-index:19;max-width:250px;padding:9px 12px;border-radius:10px;background:var(--paper);color:var(--ink);border:2px solid var(--gold-deep);box-shadow:0 8px 20px rgba(0,0,0,.6);font-size:12.5px;line-height:1.5}
.tip b{font-family:var(--f-brush);font-weight:400;font-size:17px;margin-right:6px}
.tip small{font-size:10.5px;color:#6a5a3a}
.tip p{margin:4px 0 0}
.chip{font-size:10px;line-height:1;padding:3px 5px;border-radius:4px;background:rgba(216,178,90,.16);color:var(--gold-hi);border:1px solid rgba(216,178,90,.35);white-space:nowrap}

/* ── 中央 ── */
.table{--sw:clamp(86px,23vw,196px);flex:1;display:grid;grid-template-columns:var(--sw) minmax(0,1fr) minmax(0,1fr) var(--sw);
  grid-template-areas:". tl tr ." "l arena arena r";gap:8px 6px;align-items:start;align-content:start}
.pos{min-width:0}
.pos .seat{height:100%}
.pos-tl{grid-area:tl;justify-self:center;width:min(var(--sw),100%)}
.pos-tr{grid-area:tr;justify-self:center;width:min(var(--sw),100%)}
.pos-l{grid-area:l;margin-top:10px}
.pos-r{grid-area:r;margin-top:10px}
.arena{grid-area:arena;display:flex;flex-direction:column;gap:6px;min-width:0}
.arena .board{grid-template-columns:auto auto minmax(0,1fr) minmax(0,1.15fr);min-height:170px}
@media (max-width:899px){
  .arena .board{grid-template-columns:1fr;justify-items:center;text-align:center;gap:8px;padding:12px 8px;min-height:0}
  .arena .deck{display:none}
  .arena .slot{font-size:15px}
  .arena .cap{font-size:12px}
  .arena .cap .who{font-size:16px}
  .arena .cap b{font-size:13px}
  .arena .glog{width:100%;height:92px;min-height:0;border-left:0;border-top:1px solid var(--line);padding:6px 4px 0;text-align:left}
}
@media (max-width:640px){
  .table{gap:6px 4px}
  .seat{--ps:50px;padding:8px 3px 6px;gap:3px}
  .seat .sname{font-size:13px}
  .seat .hp i{width:8px;height:8px}
  .fan{height:36px}.fan i{width:19px;height:27px;margin-left:-9.5px}.fan b{margin-left:15px;font-size:11px;height:18px;line-height:18px;min-width:18px}
  .seat .dist{font-size:10px}
  .arena .slot .card.big{--cs:15px}
  .arena .slot .ph{width:5.2em;height:7.4em;font-size:13px}
  .ticker .lines{font-size:11.5px}
}
.mright{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (min-width:900px){
  .game .me{display:grid;grid-template-columns:280px minmax(0,1fr);align-items:start;gap:16px}
  .game .me .mehead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center}
  .game .me .mehead .who{grid-column:1 / -1}
  .game .me .mestat{grid-column:2;grid-row:1;align-items:flex-start}
  .game .me .hand{min-height:118px}
}
@media (max-width:640px){ .game .me{--ps:52px;padding:10px;gap:8px} .mehead .nm b{font-size:20px} .mehead .skill{font-size:11.5px} }
.board{position:relative;display:grid;grid-template-columns:auto auto minmax(0,1fr) minmax(0,1.15fr);align-items:center;gap:14px;padding:12px 14px;border-radius:14px;min-height:150px;
  background:linear-gradient(180deg,rgba(6,9,20,.66),rgba(6,9,20,.48));border:1px solid var(--line)}
.board::before,.board::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--gold);opacity:.7}
.board::before{top:6px;left:6px;border-right:0;border-bottom:0}
.board::after{bottom:6px;right:6px;border-left:0;border-top:0}
.deck{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot{min-width:calc(4.8em * 1.25);display:grid;place-items:center;font-size:15px}
.slot .ph{width:calc(4.8em*1.25);height:calc(6.9em*1.25);border-radius:.6em;border:1px dashed var(--line);display:grid;place-items:center;font-family:var(--f-brush);font-size:16px;color:var(--muted)}
.cap{min-width:0;font-size:13px;color:var(--muted)}
.cap b{display:block;color:var(--text);font-size:15px;margin-bottom:3px}
.cap .who{font-family:var(--f-brush);font-size:20px;color:var(--gold-hi);display:block;line-height:1.2;margin-bottom:2px}
@media (max-width:480px){.board{gap:10px;padding:10px}.deck{display:none}.board{grid-template-columns:auto minmax(0,1fr)}.board .glog{grid-column:1/-1;height:72px;min-height:0;border-left:0;border-top:1px solid var(--line);padding:4px 2px 0}}
.ticker{display:flex;align-items:flex-end;gap:8px}
.ticker .lines{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:12.5px}
.ticker .lines p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b4bcd6;text-shadow:0 1px 3px #000}
.ticker .lines p:last-child{color:var(--text)}
.dmg{color:var(--red)!important}.good{color:var(--green)!important}.big{font-weight:900}.turn{color:var(--gold)!important;font-weight:700}
.glog{align-self:stretch;height:0;min-height:100%;overflow-y:auto;overscroll-behavior:contain;padding:2px 4px 2px 12px;border-left:1px solid var(--line);font-size:12.5px;line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.glog p{margin:0;color:#b4bcd6;text-shadow:0 1px 3px #000}
.glog p.turn{margin-top:4px}
.glog p:last-child{color:var(--text)}
.glog .muted{color:var(--muted)}

/* ── 自陣 ── */
.me{--ps:68px;position:relative;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(180deg,rgba(22,32,60,.9),rgba(10,15,30,.96));border:1px solid var(--line);box-shadow:0 -10px 30px -18px rgba(0,0,0,.8)}
.me.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 -10px 30px -18px rgba(0,0,0,.8)}
.me.active .portrait{animation:aura 1.4s ease-in-out var(--ad14,0s) infinite}
.mehead{display:flex;gap:14px;align-items:center}
.mehead .who{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.mehead .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mehead .nm b{font-family:var(--f-brush);font-weight:400;font-size:24px;line-height:1.1}
.mehead .nm .role{font-size:12px;font-weight:700;color:var(--gold-hi)}
.skill{font-size:12.5px;color:var(--muted);line-height:1.45}
.skill b{color:var(--gold);margin-right:3px}
.mestat{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.mestat .hp i{width:12px;height:12px}
@media (max-width:480px){.mehead{flex-wrap:wrap}.mestat{flex-direction:row;align-items:center;width:100%;justify-content:space-between}}

.prompt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:10px;background:rgba(9,13,26,.55);border:1px solid var(--line)}
.prompt .msg{flex:1 1 200px;min-width:0;font-weight:700;font-size:14px}
.prompt .msg small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.prompt.urgent{border-color:var(--red);animation:urg 1.2s ease-in-out var(--ad12,0s) infinite}
@keyframes urg{50%{box-shadow:0 0 0 2px rgba(224,80,63,.35)}}
.btn{height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--gold-hi);font-weight:900;font-size:14px;letter-spacing:.06em;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-deep));color:var(--ink);box-shadow:0 3px 0 #5c4416,0 6px 14px -6px rgba(0,0,0,.8)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5c4416}
.btn.ghost{background:rgba(12,18,34,.7);color:var(--text);border-color:var(--line);box-shadow:none}
.btn.red{background:linear-gradient(180deg,#f07a69,var(--red) 55%,#8d2419);border-color:#f59b8d;color:var(--paper);box-shadow:0 3px 0 #5e170f,0 6px 14px -6px rgba(0,0,0,.8)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.hand{display:flex;gap:6px;overflow-x:auto;padding:14px 4px 6px;min-height:128px;align-items:flex-end;scrollbar-width:thin}
.hand.tight .card{--cs:13.5px}
.hand.tight .card + .card{margin-left:-10px}
.hint{font-size:12px;color:var(--muted);min-height:1.5em}

/* ── 札 ── */
.card{--cs:15px;--art:var(--ink);--rib:var(--ink);font-size:var(--cs);position:relative;flex:0 0 auto;width:4.8em;height:6.9em;padding:0;border-radius:.5em;cursor:default;
  background:linear-gradient(160deg,var(--paper) 0%,var(--paper) 55%,var(--paper-2) 100%);color:var(--ink);border:1px solid #bfae84;
  box-shadow:inset 0 0 0 .18em rgba(255,255,255,.35),inset 0 0 0 .24em rgba(138,103,34,.25),0 4px 10px -3px rgba(0,0,0,.65);transition:transform .16s ease,box-shadow .16s ease,opacity .16s}
.card .cs{position:absolute;top:.32em;left:.42em;font-size:.72em;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink)}
.card .cs.red{color:var(--ink-red)}
.card .cn{position:absolute;top:.28em;right:.4em;font-family:var(--f-brush);font-size:1.08em;line-height:1;color:var(--ink);white-space:nowrap}
.card .cn.l3{font-size:.9em}.card .cn.l4{font-size:.7em;top:.36em}
.card .ca{position:absolute;left:.16em;right:.16em;top:1.1em;bottom:1.38em;display:grid;place-items:center;color:var(--art)}
.card .ca img,.card .ca svg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 .06em .08em rgba(0,0,0,.3))}
.card .ct{position:absolute;left:.25em;right:.25em;bottom:.25em;height:1.15em;border-radius:0 0 .35em .35em;background:var(--rib);color:var(--paper);font-size:.66em;line-height:1.15em;height:1.75em;line-height:1.75em;letter-spacing:.3em;text-align:center;font-weight:700}
.card.t-trick{--art:var(--ai);--rib:var(--ai)}
.card.t-equip{--art:var(--gold-deep);--rib:var(--gold-deep);border-color:var(--gold)}
.card.k-slash{--art:var(--ink-red)}
.card.k-heal{--art:#2a7048}
.card.ok{cursor:pointer;box-shadow:inset 0 0 0 .18em rgba(255,255,255,.35),0 0 0 2px var(--gold),0 0 14px rgba(216,178,90,.55),0 4px 10px -3px rgba(0,0,0,.65)}
.card.ok:hover{transform:translateY(-.35em)}
.card.sel{transform:translateY(-.75em) !important;box-shadow:0 0 0 3px var(--gold-hi),0 0 22px rgba(243,214,140,.7),0 12px 18px -8px rgba(0,0,0,.8)}
.card.dim{opacity:.42;filter:saturate(.4)}
.card.big{--cs:19px}
.cardback{width:3.4em;height:4.9em;font-size:15px;border-radius:.45em;border:1px solid var(--gold-deep);
  background:url("img/back.webp") center/cover no-repeat,var(--ai);text-shadow:0 0 6px #000,0 0 2px #000;
  box-shadow:3px 3px 0 #1b2b55,6px 6px 0 #142142,0 8px 14px -4px rgba(0,0,0,.7);display:grid;place-items:center;font-family:var(--f-brush);color:var(--gold-hi);font-size:20px}

/* ── 演出 ── */
#fx{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.fly{position:fixed;z-index:16;will-change:transform,opacity}
.float{position:fixed;transform:translate(-50%,-50%);font-family:var(--f-brush);font-size:34px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 10px rgba(0,0,0,.6)}
.slashfx{position:fixed;height:6px;border-radius:6px;transform-origin:left center;background:linear-gradient(90deg,transparent,var(--paper) 20%,var(--red) 60%,transparent);filter:drop-shadow(0 0 6px var(--red))}
.banner{position:fixed;left:0;right:0;top:42%;transform:translateY(-50%);display:grid;place-items:center;padding:14px 0;
  background:linear-gradient(90deg,transparent,rgba(9,13,26,.92) 18%,rgba(9,13,26,.92) 82%,transparent)}
.banner span{font-family:var(--f-brush);font-size:clamp(30px,8vw,52px);letter-spacing:.12em;color:var(--paper)}
.banner.mine span{color:var(--gold-hi)}
.banner.big span{color:var(--red);font-size:clamp(40px,12vw,76px)}

/* ── モーダル ── */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,9,18,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal{width:100%;max-width:620px;max-height:100%;overflow:auto;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(180deg,#1b2747,#111a31);border:1px solid var(--gold-deep);box-shadow:0 0 0 4px rgba(12,18,34,.9),0 0 0 5px var(--line),0 30px 60px -20px #000}
.overlay[data-kind="title"]{background:linear-gradient(180deg,rgba(6,9,18,.05),rgba(6,9,18,.25) 45%,rgba(6,9,18,.8)),url("img/title.webp") 68% 60%/cover no-repeat,var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.titlefx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:block}
.overlay[data-kind="title"] .modal{position:relative;z-index:1;background:rgba(10,15,32,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal h2{margin:0;font-family:var(--f-brush);font-weight:400;font-size:30px;line-height:1.2;text-wrap:balance}
.modal p{margin:0}
.lead{color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pick{--ps:58px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:12px;text-align:left;cursor:pointer;
  background:rgba(9,13,26,.5);border:1px solid var(--line)}
.pick:hover{border-color:var(--gold);transform:translateY(-2px)}
.pick .row{display:flex;gap:12px;align-items:center}
.pick .gn{font-family:var(--f-brush);font-size:23px;line-height:1.1}
.pick .ep{font-size:11.5px;color:var(--gold);letter-spacing:.08em}
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.tlogo{display:flex;align-items:center;gap:clamp(8px,2.4vw,16px);font-size:clamp(54px,15.5vw,96px)}
.tlogo .seal.big{font-size:.36em;padding:.22em .16em;margin:0;vertical-align:0;transform:rotate(-4deg);box-shadow:inset 0 0 0 .08em rgba(241,232,208,.6),0 0 0 .06em var(--ink-red),0 6px 18px rgba(0,0,0,.5)}
.hero .t{font-family:var(--f-brush);font-size:1em;line-height:1;letter-spacing:.06em;white-space:nowrap}
.hero .catch{font-family:var(--f-brush);font-size:clamp(17px,4.6vw,22px);letter-spacing:.2em;color:var(--paper);margin-top:2px}
.hero .t span{color:var(--red);text-shadow:0 0 24px rgba(224,80,63,.45)}
.titleimg{display:block;width:min(64vw,470px);height:auto;max-width:100%;min-width:0;flex:0 1 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7)) drop-shadow(0 0 22px rgba(224,80,63,.18))}
@media (prefers-reduced-motion:no-preference){ .titleimg{animation:brushin .9s cubic-bezier(.3,.8,.3,1) .1s both} }
.logoimg{display:block;height:34px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
@media (max-width:480px){ .logoimg{height:28px} }
@keyframes brushin{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 -5% 0 0)}}
.hero .sub{font-size:12px;letter-spacing:.6em;color:var(--gold);margin-left:.6em;margin-top:-4px}
.crests{--ps:44px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:340px}
.crests .portrait{animation:rise .6s both}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:400px}
.lvl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:rgba(9,13,26,.6);cursor:pointer}
.lvl b{font-family:var(--f-brush);font-weight:400;font-size:20px;line-height:1.1}
.lvl small{font-size:11px;color:var(--muted)}
.lvl.on{border-color:var(--gold);background:rgba(138,103,34,.32);box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(216,178,90,.35)}
.lvl.on small{color:var(--gold-hi)}
.lvdesc{max-width:400px;min-height:3em}
.stats{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rules{display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.rules h3{margin:4px 0 0;font-size:13px;letter-spacing:.2em;color:var(--gold)}
.rules ul{margin:0;padding-left:1.2em}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{white-space:nowrap;font-weight:700;color:var(--gold-hi)}
.res{display:flex;flex-direction:column;gap:8px}
.res .r{--ps:36px;display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:10px;background:rgba(9,13,26,.45)}
.res .r.win{background:rgba(216,178,90,.14);border:1px solid rgba(216,178,90,.35)}
.res .r .n{flex:1;min-width:0}
.res .r .n b{font-family:var(--f-brush);font-weight:400;font-size:18px}
.res .r .n small{display:block;color:var(--muted);font-size:11.5px}
.share{font-size:13px;padding:10px 12px;border-radius:10px;background:rgba(9,13,26,.6);border:1px dashed var(--line);white-space:pre-wrap;user-select:all}
.loglist{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.loglist p{margin:0}
.overlay[data-kind="result"]{overflow:hidden}
.resfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;display:block}
.overlay[data-kind="result"] .modal{position:relative;z-index:2;max-width:520px}
.rays{position:absolute;left:50%;top:30%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(243,214,140,.17) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle, #000 0, rgba(0,0,0,.6) 18%, transparent 45%); mask:radial-gradient(circle, #000 0, rgba(0,0,0,.6) 18%, transparent 45%);
  animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay.is-win{background:radial-gradient(80% 60% at 50% 30%, rgba(120,84,20,.55), rgba(6,9,18,.86) 70%)}
.overlay.is-win .modal{border-color:var(--gold);background:linear-gradient(180deg,rgba(40,32,14,.94),rgba(17,22,40,.96) 45%);
  box-shadow:0 0 0 4px rgba(12,18,34,.9),0 0 0 5px var(--gold),0 0 60px rgba(243,214,140,.35),0 30px 60px -20px #000}
.overlay.is-lose{background:radial-gradient(90% 70% at 50% 25%, rgba(70,16,8,.7), rgba(4,3,6,.95) 70%)}
.burn{display:block;width:calc(100% + 44px);margin:-22px -22px 0;height:210px;border-radius:17px 17px 0 0;-webkit-mask:linear-gradient(180deg,#000 75%,transparent);mask:linear-gradient(180deg,#000 75%,transparent)}
@media (min-width:640px){.burn{height:240px}}
.is-lose .rportrait{margin-top:-64px;position:relative}
.vbanner{display:block;width:calc(100% + 44px);margin:-22px -22px 0;height:230px;border-radius:17px 17px 0 0;overflow:hidden;position:relative;
  -webkit-mask:linear-gradient(180deg,#000 72%,transparent);mask:linear-gradient(180deg,#000 72%,transparent)}
.vbanner::before{content:"";position:absolute;inset:0;background:var(--vimg) center 38%/cover no-repeat;transform-origin:50% 40%}
@media (min-width:640px){.vbanner{height:260px}}
@media (prefers-reduced-motion:no-preference){ .vbanner::before{animation:vzoom 9s ease-out both} }
@keyframes vzoom{from{transform:scale(1.18);filter:brightness(1.4) saturate(1.15)}to{transform:scale(1);filter:none}}
.is-win .rportrait{margin-top:-70px;position:relative}
.overlay.is-lose .modal{border-color:#5a1d16;background:linear-gradient(180deg,#140b0c,#0c0b11);box-shadow:0 0 0 4px rgba(5,5,8,.9),0 0 0 5px rgba(120,30,20,.5),0 30px 60px -20px #000}
.rhero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:4px}
.rportrait{--ps:112px;margin-bottom:6px;animation:rpop .7s cubic-bezier(.2,1.4,.4,1) both}
.is-win .rportrait .portrait{box-shadow:0 0 0 3px var(--gold-hi),0 0 0 7px rgba(12,18,34,.9),0 0 0 9px var(--gold),0 0 40px 8px rgba(243,214,140,.5)}
.is-lose .rportrait{filter:grayscale(1) brightness(.75) contrast(1.1);animation:none}
@keyframes rpop{from{transform:scale(.4);opacity:0}}
.verdict{font-family:var(--f-brush);font-size:clamp(64px,19vw,96px);line-height:1;letter-spacing:.12em;margin-left:.12em}
.verdict.win{background:linear-gradient(100deg,#b8862b 0%,#ffe9a8 25%,#fff8dc 32%,#f3d68c 40%,#b8862b 55%,#ffe9a8 75%,#c9952f 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(60,40,8,.8)) drop-shadow(0 0 22px rgba(243,214,140,.55));
  animation:stampin .55s cubic-bezier(.2,1.6,.4,1) .15s both, shine 3.2s linear 1s infinite}
@keyframes stampin{from{transform:scale(2.4) rotate(-6deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shine{to{background-position:-250% 0}}
.verdict.lose{color:#e3ddd2;text-shadow:0 0 2px #000,0 3px 0 #000,0 0 30px rgba(0,0,0,.9);animation:inkin 1.6s ease-out both}
@keyframes inkin{from{filter:blur(14px);opacity:0;letter-spacing:.4em}to{filter:blur(0);opacity:1}}
.rhead{font-family:var(--f-brush);font-size:clamp(22px,6vw,28px);line-height:1.3;text-wrap:balance}
.is-win .rhead{color:var(--gold-hi)}
.is-lose .rhead{color:#d9573f}
.rsub{color:var(--text);font-size:14px}
.is-lose .rsub{color:#d8d2c8;text-shadow:0 1px 4px #000}
.is-lose .rhead,.is-lose .rmeta{text-shadow:0 1px 4px #000,0 0 14px #000}
.rmeta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.res .r{position:relative}
.res .r.mine{box-shadow:inset 3px 0 0 var(--gold)}
.is-lose .res .r.mine{box-shadow:inset 3px 0 0 #8d2419}
.wmark{font-family:var(--f-brush);font-size:16px;line-height:1;color:var(--ink);background:var(--gold);border-radius:4px;padding:4px 5px;transform:rotate(-6deg)}
.is-lose .res .r.win{background:rgba(120,30,20,.16);border-color:rgba(160,50,30,.35)}
.is-lose .wmark{background:#8d2419;color:var(--paper)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── スマホ横向き:縦スクロールなしで卓と手札が一度に収まる配置 ── */
@media (orientation:landscape) and (max-height:540px), (orientation:portrait) and (max-width:600px){
  .game{gap:4px;padding-block:4px 6px;min-height:100%;height:100%}
  .bar{gap:5px;height:26px}
  .logo .seal{font-size:9px}
  .logoimg{height:22px}
  .info{font-size:10.5px}
  .ibtn{height:24px;min-width:24px;padding:0 6px;font-size:10.5px;border-radius:6px}
  /* 卓:左列(左下・左上)/中央(場)/右列(右上・右下) */
  .table{--sw:clamp(160px,23vw,210px);grid-template-columns:var(--sw) minmax(0,1fr) var(--sw);
    grid-template-areas:"tl arena tr" "l arena r";grid-template-rows:auto auto;gap:4px 8px;flex:0 0 auto}

const SND={ctx:null};

function tone(f,f2,dur,type='sine',vol=.25,delay=0){ const c=ac(); if(!c) return; const t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03); }
function noise(dur,vol=.2,freq=1500,delay=0){ const c=ac(); if(!c) return; const t=c.currentTime+delay; const b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate); const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; const g=c.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); }
// 効果音(効果音ラボの素材)。ファイルがある音だけ鳴らし、ない音は何もしない
const SFX = (()=>{
  if(HEADLESS) return {play(){}, load(){}};
  const FILES={card:'audio/sfx/card.mp3', draw:'audio/sfx/draw.mp3', slash:'audio/sfx/slash.mp3', dodge:'audio/sfx/dodge.mp3'};
  const VOL={card:1.5, draw:1.4, slash:.75, dodge:1.1};
  const bufs={}; let loading=null;
  function load(){
    if(loading) return loading; const c=audioCtx(); if(!c) return null;
    loading=Promise.all(Object.entries(FILES).map(async ([k,u])=>{ try{ const r=await fetch(u); const ab=await r.arrayBuffer(); bufs[k]=await c.decodeAudioData(ab); }catch(e){} }));
    return loading;
  }
  function play(k, delay=0){
    if(!UI.sound || !FILES[k]) return; const c=audioCtx(); if(!c) return;
    if(!bufs[k]){ load(); return; }
    const s=c.createBufferSource(); s.buffer=bufs[k]; s.playbackRate.value=.94+Math.random()*.12;
    const g=c.createGain(); g.gain.value=VOL[k]||.8; s.connect(g); g.connect(c.destination); s.start(c.currentTime+delay);
  }
  return {play, load};
})();

function seatDist(a,b){ const al=alive(); const ia=al.indexOf(a), ib=al.indexOf(b), n=al.length; const d=Math.abs(ia-ib); return Math.min(d,n-d); }
function dist(a,b){ let d=seatDist(a,b); if(b.equip.horseP) d++; if(b.gen.id==='hanzo') d++; if(a.equip.horseM) d--; return Math.max(1,d); }
function range(p){ return p.equip.weapon ? CARD_DEFS[p.equip.weapon.key].range : 1; }
function canSlashTarget(a,b){ return a!==b && b.alive && (a.gen.id==='kenshin' || dist(a,b)<=range(a)); }
function slashLimitOk(p){ return p.slashUsed<1 || p.gen.id==='nobunaga' || (p.equip.weapon && p.equip.weapon.key==='hayago'); }
function asSlash(p,c){ return c.key==='slash' || (c.key==='dodge' && p.gen.id==='yukimura'); }
function asDodge(p,c){ return c.key==='dodge' || (c.key==='slash' && p.gen.id==='yukimura'); }
function equipList(p){ return EQUIP_TYPES.map(t=>p.equip[t]).filter(Boolean); }
function hasCards(p){ return p.hand.length>0 || equipList(p).length>0; }
function canSteal(a,b){ return a!==b && b.alive && hasCards(b) && b.gen.id!=='motonari' && (a.gen.id==='hanzo' || dist(a,b)<=1); }
function canRaid(a,b){ return a!==b && b.alive && hasCards(b) && b.gen.id!=='motonari'; }

function drawOne(){
  if(!G.deck.length){ G.deck=shuffle(G.discard); G.discard=[]; if(G.deck.length) log('山札を切り直した','sys'); }
  return G.deck.pop() || null;
}

function removeFromHand(p,c){ const i=p.hand.indexOf(c); if(i>=0) p.hand.splice(i,1); }

/* ===================== 立場の推測(AI用) ===================== */
function hostile(src,tgt){
  if(src.role==='lord') return;
  if(tgt.role==='lord') src.aff-=3; else if(tgt.aff>0) src.aff-=1; else if(tgt.aff<0) src.aff+=1;
}
function friendly(src,tgt){
  if(src.role==='lord'||src===tgt) return;
  if(tgt.role==='lord') src.aff+=2; else src.aff+=Math.sign(tgt.aff);
}
function nonLordOthers(p){ return alive().filter(x=>x!==p && x.role!=='lord'); }
function isEnemy(p,q){
  if(p===q || !q.alive) return false;
  const late = G.turnCount>LV(p).late;
  const fallback = () => {
    const cand = nonLordOthers(p); if(!cand.length || cand.some(x=>x.aff<0)) return false;
    const min = Math.min(...cand.map(x=>x.aff)); return late && q.aff===min && q.role!=='lord';
  };
  switch(p.role){
    case 'lord':  return q.aff<0 || fallback();
    case 'loyal': if(q.role==='lord') return false; return q.aff<0 || fallback();
    case 'rebel': if(q.role==='lord') return true; return q.aff>0 || (q.aff===0 && G.turnCount>8);
    case 'traitor': {
      const others = nonLordOthers(p);
      if(q.role==='lord') return others.length===0;
      return q.aff<0 || !others.some(x=>x.aff<0);
    }
  }
  return false;
}
function isAlly(p,q){
  if(p===q) return true;
  switch(p.role){
    case 'lord':  return q.aff>0;
    case 'loyal': return q.role==='lord' || q.aff>0;
    case 'rebel': return q.role!=='lord' && q.aff<0;
    case 'traitor': return q.role==='lord' && nonLordOthers(p).length>0;
  }
  return false;
}

function judge(p, reason){
  const c=drawOne(); if(!c) return {suit:'♠',num:0};
  G.discard.push(c); showField(c,p,null,`${reason}の判定:${isRed(c)?'赤':'黒'}`,true);
  log(`${nm(p)}の${reason}判定:${c.suit}${numLabel(c.num)}`, isRed(c)?'good':'sys');
  return c;
}
async function respond(p, kind, ctx){
  if(kind==='dodge' && p.equip.armor){
    const j=judge(p,'南蛮胴'); await wait(UI.speed*.8);
    if(isRed(j)){ log(`南蛮胴が${nm(p)}を守った`,'good'); if(VIS){ sfx.dodge(); fxFloat(p,'防','#f3d68c'); } return true; }
  }
  const pred = kind==='dodge' ? c=>asDodge(p,c) : c=>asSlash(p,c);
  const cands = p.hand.filter(pred);
  if(!cands.length) return false;
  let card=null;
  if(p.isHuman){
    card = await humanInput({mode:'pick', prompt:ctx.prompt, sub:ctx.sub, filter:pred, pass:'出さない', urgent:true}, p);
  } else {
    const pref = kind==='dodge'?'dodge':'slash';
    if(ctx.remaining && cands.length<ctx.remaining) card=null;
    else if(ctx.duel && ctx.from && isAlly(p,ctx.from) && p.hp>1) card=null;
    else if(Math.random()>LV(p).dodge) card=null;
    else { cands.sort((a,b)=>(a.key===pref?-1:1)-(b.key===pref?-1:1)); card=cands[0]; }
  }
  if(!card) return false;
  removeFromHand(p,card); G.discard.push(card);
  const want = kind==='dodge'?'受':'斬';
  showField(card,p,null, card.name!==want ? `${card.name}を${want}として` : null);
  if(VIS && kind==='dodge'){ sfx.dodge(); fxFloat(p,'受','#e8eefc'); }
  say(p, kind==='dodge'?'dodge':'slash', kind==='slash'?'hot':'');
  log(`${nm(p)}は${want}を出した${card.name!==want?`(${card.name}を${want}として)`:''}`);
  await wait(UI.speed*.6);
  return true;
}

          sub: q===t ? '使わなければ討ち死にします。' : `あなたは${ROLES[q.role].name}。救うかどうかで立場が読まれます。`, filter:c=>c.key==='heal', pass:'使わない'}, q);
      } else use = (isAlly(q,t) && (q===t || Math.random()<LV(q).save)) ? heals[0] : null;
      if(!use) break;
      removeFromHand(q,use); G.discard.push(use); t.hp++; friendly(q,t); say(q, q===t?'heal':'save', 'good');
      showField(use,q,t); healFx(t); log(`${nm(q)}が${nm(t)}に薬を使った`,'good'); await wait(UI.speed*.6);
    }
    if(t.hp>0) return;
  }
  await kill(t, src);
}
async function kill(t, src){
  t.alive=false;
  say(t,'death');
  if(VIS){ sfx.death(); fxBanner(`${t.gen.name} 討死`, 'big'); }
  log(`${t.gen.name}、討ち死に。正体は【${ROLES[t.role].name}】`, 'dmg big');
  for(const c of [...t.hand, ...equipList(t), ...t.judge]) G.discard.push(c);
  t.hand=[]; t.equip={weapon:null,armor:null,horseM:null,horseP:null}; t.judge=[];
  if(src && src.alive && src!==t){
    if(t.role==='rebel'){ draw(src,3); log(`謀反人を討った${nm(src)}は3枚引く`,'sys'); }
    if(t.role==='loyal' && src.role==='lord'){
      for(const c of [...src.hand, ...equipList(src)]) G.discard.push(c);
      src.hand=[]; src.equip={weapon:null,armor:null,horseM:null,horseP:null};
      log('天下人が家臣を討った。罰として手札と装備をすべて失う','dmg');
    }
  }
  render(); await wait(UI.speed*1.1); checkWin();
}
function checkWin(){
  const al=alive(); const lord=G.players.find(p=>p.role==='lord');
  let w=null;
  if(!lord.alive) w = (al.length===1 && al[0].role==='traitor') ? 'traitor' : 'rebel';
  else if(!al.some(p=>p.role==='rebel'||p.role==='traitor')) w='lord';
  if(w){ G.over=true; G.winner=w; throw new Stop('over'); }
}

/* ===================== カード効果 ===================== */
async function doSlash(src, tgt){
  log(`${nm(src)} ⟶ ${nm(tgt)}:斬`); hostile(src,tgt);
  if(VIS){ sfx.slash(); fxSlash(tgt); }
  const need = src.gen.id==='shingen' ? 2 : 1;
  let blocked=true;
  for(let i=0;i<need;i++){
    const ok = await respond(tgt,'dodge',{from:src, remaining:need-i,
      prompt:`${src.gen.name}の斬!受を出しますか?`, sub: need>1 ? `風林火山:受があと${need-i}枚必要です。` : '出さなければ1ダメージ。'});
    if(!ok){ blocked=false; break; }
  }
  if(!blocked){
    let n=1; if(src.gen.id==='mitsuhide' && tgt.role==='lord'){ n=2; log('光秀【本能寺】!','dmg'); if(VIS) fxBanner('敵は本能寺にあり','big'); }
    await damage(src,tgt,n,'斬'); return;
  }
  log(`${nm(tgt)}は斬を防いだ`,'sys');
  if(src.alive && tgt.alive && src.equip.weapon && src.equip.weapon.key==='tachi'){
    const cands=src.hand.filter(c=>asSlash(src,c)); if(!cands.length) return;
    const c = src.isHuman
      ? await humanInput({mode:'pick', prompt:'太刀:続けてもう一度斬を出しますか?', filter:c=>asSlash(src,c), pass:'出さない'}, src)
      : (isEnemy(src,tgt) ? cands[0] : null);
    if(c){ removeFromHand(src,c); G.discard.push(c); showField(c,src,tgt,'太刀の追撃'); await wait(UI.speed*.5); await doSlash(src,tgt); }
  }
}
async function doDuel(src,tgt){ log(`${nm(src)} ⟶ ${nm(tgt)}:一騎討ち`);
  if(VIS) fxBanner('一騎討ち');
  let cur=tgt, other=src;
  for(let guard=0; guard<60; guard++){
    const ok = await respond(cur,'slash',{from:other, duel:true, prompt:`一騎討ち(相手:${other.gen.name})。斬を出しますか?`, sub:'出せなければ1ダメージ。'});
    if(!ok){ await damage(other,cur,1,'一騎討ち'); return; }
    [cur,other]=[other,cur];
  }
}
// 看破:計略が効く直前に、全員へ順に看破するか尋ねる。看破は看破し返せる。戻り値=無効になったか
function aiWantsKanpa(q,key,src,tgt,cancelled){
  if(Math.random()>LV(q).dodge) return false;
  const bad=BAD_TRICKS.has(key);
  const wants = q===src ? true : q===tgt ? !bad : (bad ? isEnemy(q,tgt) : isAlly(q,tgt));
  const opposes = q===src ? false : q===tgt ? bad : (bad ? isAlly(q,tgt) : isEnemy(q,tgt));
  if(!cancelled) return opposes && (bad || Math.random()<.35);
  return wants && (bad || q===src);
}
async function nullified(key, src, tgt, multi=false){
  let cancelled=false;
  const name=CARD_DEFS[key].name;
  for(let round=0; round<8; round++){
    let played=null;
    for(const q of orderFrom(G.players[G.cur])){
      if(!q.alive) continue;
      const kc=q.hand.find(c=>c.key==='kanpa'); if(!kc) continue;
      let use=null;
      if(q.isHuman){
        // 全体計略は自分が狙われた時だけ尋ねる(毎回の確認を減らす)
        if(multi && !(q===tgt && BAD_TRICKS.has(key) && !cancelled)) continue;
        if(!cancelled && q===src) continue;
        const who = src ? src.gen.name : '天';
        const prompt = !cancelled ? `${who}の「${name}」(対象:${tgt===q?'あなた':tgt.gen.name})を看破しますか?` : `「${name}」が看破された。看破し返して通しますか?`;
        use = await humanInput({mode:'pick', prompt, sub:'看破の札をタップすると出します。', filter:c=>c.key==='kanpa', pass:'看破しない', urgent:true}, q);
      } else use = aiWantsKanpa(q,key,src,tgt,cancelled) ? kc : null;
      if(!use) continue;
      removeFromHand(q,use); G.discard.push(use);
      showField(use,q,tgt, cancelled ? '看破し返す' : `「${name}」を看破`); say(q,'kanpa','hot');
      log(`${nm(q)}は${cancelled?'看破し返した':`「${name}」を看破した`}`, 'big');
      if(!cancelled){ BAD_TRICKS.has(key) ? friendly(q,tgt) : hostile(q,tgt); }
      await wait(UI.speed*.7);
      played=q; break;
    }
    if(!played) break;
    cancelled=!cancelled;
  }
  if(cancelled) log(`「${name}」は無効になった`,'sys');
  return cancelled;
}
async function doAoe(src, kind, title, key){
  log(`${nm(src)}:${title}!`); if(VIS) fxBanner(title);
  for(const q of orderFrom(src).slice(1)){
    if(!q.alive) continue;
    if(await nullified(key, src, q, true)) continue;
    const ok = await respond(q, kind, {from:src, prompt:`${src.gen.name}の${title}!${kind==='slash'?'斬':'受'}を出しますか?`, sub:'出せなければ1ダメージ。'});
    if(!ok) await damage(src,q,1,title);
  }
}
async function doHarvest(p){
  const pool=[]; for(let i=0;i<alive().length;i++){ const c=drawOne(); if(c) pool.push(c); }
  if(VIS) fxBanner('豊作');
  log(`${nm(p)}の豊作:${pool.map(c=>c.name).join('・')}がめくられた`,'good');
  G.harvest=pool; render(); await wait(UI.speed*.6);
  for(const q of orderFrom(p)){
    if(!pool.length) break;
    if(await nullified('housaku',p,q,true)) continue;
    let pick;
    if(q.isHuman) pick = await humanInput({mode:'harvest', pool}, q);
    else pick=[...pool].sort((a,b)=>cardValue(q,b)-cardValue(q,a))[0];
    pool.splice(pool.indexOf(pick),1); q.hand.push(pick);
    log(`${nm(q)}は「${pick.name}」を取った`,'sys'); render(); await wait(UI.speed*.45);
  }
  for(const c of pool) G.discard.push(c);
  G.harvest=null;
}
async function doRikan(p, A, B){
  if(!A || !A.alive || !A.equip.weapon) return;
  if(await nullified('rikan',p,A)) return;
  if(!B || !B.alive || !canSlashTarget(A,B)){ const w=A.equip.weapon; A.equip.weapon=null; p.hand.push(w); log(`${nm(A)}は${w.name}を${nm(p)}に渡した`,'sys'); return; }
  log(`${nm(p)}の離間の計:${nm(A)}に${nm(B)}を斬れと迫る`,'dmg');
  const cands=A.hand.filter(c=>asSlash(A,c));
  let c=null;
  if(cands.length){
    if(A.isHuman) c = await humanInput({mode:'pick', prompt:`離間の計:${B.isHuman&&!NET?'あなた':B.gen.name}を斬りますか?`, sub:`斬らなければ${A.equip.weapon.name}を${p.isHuman&&!NET?'あなた':p.gen.name}に渡します。`, filter:x=>asSlash(A,x), pass:'武器を渡す', urgent:true}, A);
    else c = !isAlly(A,B) ? cands[0] : null;
  }
  if(c){ removeFromHand(A,c); G.discard.push(c); showField(c,A,B,'離間の計で斬る'); say(A,'slash','hot'); await wait(UI.speed*.5); await doSlash(A,B); }
  else { const w=A.equip.weapon; A.equip.weapon=null; p.hand.push(w); log(`${nm(A)}は斬らず、${w.name}を${nm(p)}に渡した`,'sys'); if(VIS) fxFloat(A,'奪','#f3d68c'); }
}
// 置いた札の判定(手番の始め)
async function judgePhase(p){
  const res={skipDraw:false, skipAct:false};
  for(const c of [...p.judge].reverse()){
    if(!p.alive) break;
    p.judge.splice(p.judge.indexOf(c),1); render();
    const cancelled = await nullified(c.key, null, p);
    if(c.key==='rakurai'){
      if(!cancelled){
        const j=judge(p,'落雷'); await wait(UI.speed*.8);
        if(j.suit==='♠' && j.num>=2 && j.num<=9){
          G.discard.push(c); if(VIS) fxBanner('落雷','big'); log(`雷が${nm(p)}を直撃!`,'dmg big');
          await damage(null,p,3,'落雷'); continue;
        }
      }
      passRakurai(p,c); continue;
    }
    G.discard.push(c);
    if(cancelled) continue;
    const j=judge(p, c.name); await wait(UI.speed*.8);
    if(c.key==='shuen'){ if(j.suit!=='♥'){ res.skipAct=true; log(`${nm(p)}は酒宴に溺れ、札を使えない`,'dmg'); } else log(`${nm(p)}は酒宴を断った`,'good'); }
    if(c.key==='hyourou'){ if(j.suit!=='♣'){ res.skipDraw=true; log(`${nm(p)}は兵糧を断たれ、札を引けない`,'dmg'); } else log(`${nm(p)}は兵糧を守った`,'good'); }
  }
  return res;
}
function passRakurai(p,c){
  const nxt=orderFrom(p).slice(1).find(q=>!hasJ(q,'rakurai')) || p;
  nxt.judge.push(c); log(`落雷は${nm(nxt)}の頭上へ移った`,'sys'); render();
}
async function takeCardFrom(actor, target, verb){
  const opts=[]; if(target.hand.length) opts.push({zone:'hand'});
  for(const t of EQUIP_TYPES) if(target.equip[t]) opts.push({zone:'equip', slot:t});
  if(!opts.length) return null;
  let ch;
  if(actor.isHuman){
    ch = await humanInput({mode:'zone', target, verb}, actor);
  } else {
    const eqPref=['armor','weapon','horseP','horseM'].find(t=>target.equip[t]);
    ch = (target.hand.length && (Math.random()<.6 || !eqPref)) ? {zone:'hand'} : (eqPref ? {zone:'equip', slot:eqPref} : opts[0]);
  }
  let card;
  if(ch.zone==='hand'){ card=target.hand[Math.floor(Math.random()*target.hand.length)]; removeFromHand(target,card); }
  else { card=target.equip[ch.slot]; target.equip[ch.slot]=null; }
  if(NET && ch.zone==='hand'){
    log(`${nm(actor)}は${nm(target)}の手札1枚を${verb}`, '', {hide:[actor.seat,target.seat]});
    log(`${nm(actor)}は${nm(target)}の「${card.name}」を${verb}`, '', {only:[actor.seat,target.seat]});
  } else {
  const visible = ch.zone==='equip' || actor.isHuman || target.isHuman;
  log(`${nm(actor)}は${nm(target)}の${visible?`「${card.name}」`:'手札1枚'}を${verb}`);
  }
  if(VIS) fxFloat(target, verb==='奪った'?'奪':'焼','#f3d68c');
  return card;
}

async function execPlay(p, card, target, asKey, extra){
  removeFromHand(p,card);
  const def=CARD_DEFS[card.key];
  if(EQUIP_TYPES.includes(def.type)){
    const old=p.equip[def.type]; if(old) G.discard.push(old);
    p.equip[def.type]=card; showField(card,p,null,'装備した'); say(p, def.type); log(`${nm(p)}は${card.name}を装備`,'sys'); return;
  }
  const k = asKey || card.key;
  if(!DELAYED.includes(k)) G.discard.push(card);
  showField(card,p,target, (k==='slash' && card.key!=='slash') ? `${card.name}を斬として` : null);
  say(p, k, k==='slash'||k==='duel'||k==='raid'||k==='uprising'||k==='volley'||k==='rikan'||k==='hyourou' ? 'hot' : k==='heal'||k==='tea'||k==='housaku' ? 'good' : '');
  await wait(UI.speed*.45);
  switch(k){
    case 'slash': p.slashUsed++; await doSlash(p,target); break;
    case 'heal': p.hp=Math.min(p.maxHp,p.hp+1); healFx(p); log(`${nm(p)}は薬で体力を回復`,'good'); break;
    case 'funds': if(await nullified('funds',p,p)) break; draw(p,2); log(`${nm(p)}:軍資金で2枚引く`,'sys'); break;
    case 'steal': { hostile(p,target); if(await nullified('steal',p,target)) break; const c=await takeCardFrom(p,target,'奪った'); if(c) p.hand.push(c); break; }
    case 'raid':  { hostile(p,target); if(await nullified('raid',p,target)) break; const c=await takeCardFrom(p,target,'焼き払った'); if(c) G.discard.push(c); break; }
    case 'duel': hostile(p,target); if(await nullified('duel',p,target)) break; await doDuel(p,target); break;
    case 'uprising': await doAoe(p,'slash','一揆','uprising'); break;
    case 'volley': await doAoe(p,'dodge','鉄砲隊','volley'); break;
    case 'tea': log(`${nm(p)}の茶会`,'good'); for(const q of orderFrom(p)) if(q.hp<q.maxHp){ if(await nullified('tea',p,q,true)) continue; q.hp++; healFx(q); } break;
    case 'shuen': case 'hyourou': hostile(p,target); target.judge.push(card); log(`${nm(p)}は${nm(target)}の席に「${card.name}」を置いた`,'dmg'); break;
    case 'rakurai': p.judge.push(card); log(`${nm(p)}は自分の席に「落雷」を置いた`,'sys'); break;
    case 'housaku': await doHarvest(p); break;
    case 'rikan': await doRikan(p, target, extra); break;
  }
  render();
}

/* ===================== 人間:プレイ可否 ===================== */
function playInfo(p,c){
  const def=CARD_DEFS[c.key]; const others=alive().filter(q=>q!==p);
  if(EQUIP_TYPES.includes(def.type)) return {ok:true, targets:null};
  if(asSlash(p,c)){
    if(!slashLimitOk(p)) return {ok:false, why:'斬は1手番に1回までです。この手番はもう使いました。'};
    const ts=others.filter(q=>canSlashTarget(p,q));
    return ts.length ? {ok:true, targets:ts, asKey:'slash'} : {ok:false, why:'斬が届く距離に相手がいません。槍や火縄銃などの武器を装備すると、遠くまで届きます。'};
  }
  switch(c.key){
    case 'dodge': return {ok:false, why:'受は、相手に斬られたときに出す札です。'};
    case 'heal': return p.hp<p.maxHp ? {ok:true,targets:null} : {ok:false, why:'体力が満タンなので使えません。体力0で倒れかけた味方を救うために取っておけます。'};
    case 'funds': case 'tea': case 'uprising': case 'volley': return {ok:true, targets:null};
    case 'steal': { const ts=others.filter(q=>canSteal(p,q)); return ts.length?{ok:true,targets:ts}:{ok:false,why:'隣(距離1)に、札を持っている相手がいません。'}; }
    case 'raid':  { const ts=others.filter(q=>canRaid(p,q)); return ts.length?{ok:true,targets:ts}:{ok:false,why:'対象にできる相手がいません。'}; }
    case 'duel': return {ok:true, targets:others};
    case 'kanpa': return {ok:false, why:'看破は、誰かが計略を使った時に出します。'};
    case 'housaku': return {ok:true, targets:null};
    case 'rakurai': return hasJ(p,'rakurai') ? {ok:false, why:'すでに落雷が置かれています。'} : {ok:true, targets:null};
    case 'shuen': { const ts=others.filter(q=>!hasJ(q,'shuen')); return ts.length?{ok:true,targets:ts}:{ok:false,why:'置ける相手がいません。'}; }
    case 'hyourou': { const ts=others.filter(q=>dist(p,q)<=1 && !hasJ(q,'hyourou')); return ts.length?{ok:true,targets:ts}:{ok:false,why:'隣(距離1)に、置ける相手がいません。'}; }
    case 'rikan': { const ts=others.filter(A=>A.equip.weapon && alive().some(b=>b!==A && canSlashTarget(A,b))); return ts.length?{ok:true,targets:ts}:{ok:false,why:'武器を持ち、斬れる相手がいる武将がいません。'}; }
  }
  return {ok:false};
}

/* ===================== AI ===================== */
const LEVELS = {
  easy:  {name:'足軽',   sub:'やさしい',   desc:'うっかり者ぞろい。札を出し忘れたり、受を出しそびれたり、味方を見捨てたりします。', act:.8, dodge:.75, save:.65, wander:.25, late:16, extra:0, smart:false},
  normal:{name:'侍大将', sub:'ふつう',     desc:'標準の強さ。自分の身分に沿って素直に動きます。', act:1, dodge:1, save:1, wander:0, late:12, extra:0, smart:false},
  hard:  {name:'大名',   sub:'むずかしい', desc:'手強い相手。弱った敵や守りの薄い敵に集中し、薬を温存します。CPUは初期手札+1、毎ターン1枚多く引きます。', act:1, dodge:1, save:1, wander:0, late:6, extra:1, smart:true, draw:1, hp:0},
};
function LV(p){ return LEVELS[(p && p.lv) || (G && G.level) || 'normal']; }
function cardValue(p,c){
  const base={heal:9,dodge:7,slash:5,funds:6,steal:6,raid:5,duel:5,uprising:4,volley:4,tea:3,kanpa:7,shuen:6,hyourou:5,rikan:4,housaku:4,rakurai:2};
  if(!(c.key in base)) return 2;
  let v=base[c.key];
  if(c.key==='slash' && p.hand.filter(x=>x.key==='slash').length>2) v-=2;
  return v;
}
function aiDiscard(p,n){ return [...p.hand].sort((a,b)=>cardValue(p,a)-cardValue(p,b)).slice(0,n); }
function pickTarget(p, list){
  if(!list.length) return null;
  const L=LV(p);
  if(L.wander && Math.random()<L.wander) return list[Math.floor(Math.random()*list.length)];
  if(L.smart){
    const lord=G.players.find(x=>x.role==='lord');
    const score=q=>q.hp*2 + q.hand.length*.6 + (q.equip.armor?1.2:0) + (q.equip.horseP?.4:0)
      - ((p.role==='rebel'||(p.role==='traitor'&&nonLordOthers(p).length===0)) && q===lord ? (lord.hp<=2?20:8) : 0);
    return [...list].sort((a,b)=>score(a)-score(b))[0];
  }
  return [...list].sort((a,b)=>{
    const la=(p.role==='rebel'&&a.role==='lord')?-10:0, lb=(p.role==='rebel'&&b.role==='lord')?-10:0;
    return (la+a.hp)-(lb+b.hp);
  })[0];
}
function aiChooseAction(p){
  const H=p.hand, others=alive().filter(q=>q!==p), enemies=others.filter(q=>isEnemy(p,q));
  for(const c of H){
    const t=CARD_DEFS[c.key].type; if(!EQUIP_TYPES.includes(t)) continue;
    const cur=p.equip[t];
    if(!cur) return {card:c};
    if(t==='weapon' && CARD_DEFS[c.key].range>CARD_DEFS[cur.key].range && cur.key!=='hayago') return {card:c};
  }
  const find=k=>H.find(c=>c.key===k);
  if(p.hp<p.maxHp && find('heal')){
    const n=H.filter(c=>c.key==='heal').length;
    if(!LV(p).smart || p.hp<=1 || p.hp<=p.maxHp-2 || n>=2) return {card:find('heal')};
  }
  if(find('funds')) return {card:find('funds')};
  if(find('tea') && p.hp<p.maxHp){
    const score=others.reduce((s,q)=>s+(q.hp<q.maxHp?(isAlly(p,q)?1:isEnemy(p,q)?-1:0):0),1);
    if(score>0) return {card:find('tea')};
  }
  if(find('steal')){ const t=pickTarget(p,enemies.filter(q=>canSteal(p,q))); if(t) return {card:find('steal'), target:t}; }
  if(find('raid')){
    const ts=enemies.filter(q=>canRaid(p,q));
    const t=ts.find(q=>q.equip.armor||q.equip.weapon) || pickTarget(p,ts);
    if(t) return {card:find('raid'), target:t};
  }
  const slashes=H.filter(c=>c.key==='slash');
  if(find('duel') && slashes.length>=1){ const t=pickTarget(p,enemies); if(t) return {card:find('duel'), target:t}; }
  for(const k of ['uprising','volley']){
    if(!find(k)) continue;
    const score=others.reduce((s,q)=>s+(isEnemy(p,q)?1:isAlly(p,q)?-1:0),0);
    if(score>0) return {card:find(k)};
  }
  if(find('shuen')){ const t=pickTarget(p,enemies.filter(q=>!hasJ(q,'shuen'))); if(t) return {card:find('shuen'), target:t}; }
  if(find('hyourou')){ const t=pickTarget(p,enemies.filter(q=>dist(p,q)<=1 && !hasJ(q,'hyourou'))); if(t) return {card:find('hyourou'), target:t}; }
  if(find('housaku')){ const sc=others.reduce((s,q)=>s+(isAlly(p,q)?1:isEnemy(p,q)?-1:0),1); if(sc>=0) return {card:find('housaku')}; }
  if(find('rikan')){
    const As=others.filter(A=>A.equip.weapon).sort((a,b)=>(isEnemy(p,b)?1:0)-(isEnemy(p,a)?1:0));
    for(const A of As){ const Bs=alive().filter(b=>b!==A && b!==p && canSlashTarget(A,b) && isEnemy(p,b)); if(Bs.length) return {card:find('rikan'), target:A, extra:pickTarget(p,Bs)}; }
  }
  if(find('rakurai') && !hasJ(p,'rakurai') && p.hp>=3 && Math.random()<.5) return {card:find('rakurai')};
  if(slashLimitOk(p)){
    let sc=slashes[0];
    if(!sc && p.gen.id==='yukimura' && H.filter(c=>c.key==='dodge').length>1) sc=H.find(c=>c.key==='dodge');
    if(sc){ const t=pickTarget(p,enemies.filter(q=>canSlashTarget(p,q))); if(t) return {card:sc, target:t, asKey:'slash'}; }
  }
  return null;
}
async function aiActionPhase(p){
  for(let guard=0; guard<40 && p.alive; guard++){
    const act=aiChooseAction(p); if(!act) break;
    if(Math.random()>LV(p).act) break;
    await execPlay(p, act.card, act.target, act.asKey, act.extra);
    await wait(UI.speed);
  }
}
async function humanActionPhase(p){
  while(p.alive){
    const res = await humanInput({mode:'action'}, p);
    if(res.type==='end') break;
    let extra=null;
    if(res.card.key==='rikan'){
      const opts=alive().filter(b=>b!==res.target && canSlashTarget(res.target,b));
      extra = await humanInput({mode:'victim', a:res.target, options:opts}, p);
    }
    await execPlay(p, res.card, res.target, res.asKey, extra);
  }
}

/* ===================== 進行 ===================== */
async function playTurn(p){
  G.turnCount++; p.slashUsed=0;
  if(NET) NET.fx('turn',[p.seat]);
  else if(!HEADLESS){ sfx.turn(); fxBanner(p.isHuman?'あなたの手番':`${p.gen.name}の手番`, p.isHuman?'mine':''); }
  log(`― ${p.isHuman&&!NET?'あなた':p.gen.name}の手番 ―`, 'turn');
  const J = p.judge.length ? await judgePhase(p) : {skipDraw:false, skipAct:false};
  if(!p.alive) return;
  const n = J.skipDraw ? 0 : draw(p, (p.gen.id==='hideyoshi'?3:2) + (p.isHuman?0:(LV(p).draw||0)));
  log(`${nm(p)}は${n}枚引いた`, 'sys');
  await wait(p.isHuman ? UI.speed*.5 : UI.speed*1.1);
  if(!J.skipAct){ if(p.isHuman) await humanActionPhase(p); else await aiActionPhase(p); }
  if(!p.alive) return;
  const over = p.hand.length - Math.max(p.hp,0);
  if(over>0){
    const cards = p.isHuman ? await humanInput({mode:'discard', n:over}, p) : aiDiscard(p,over);
    for(const c of cards){ removeFromHand(p,c); G.discard.push(c); }
    log(`${nm(p)}は手札を${over}枚捨てた`, 'sys');
  }
  G.field=null;
}

function setupGame(humanSeat){
  const roles = shuffle(['lord','loyal','rebel','rebel','traitor']);
  const players = roles.map((role,i)=>({
    seat:i, role, isHuman: i===humanSeat, gen:null, hp:0, maxHp:0, hand:[], alive:true, slashUsed:0,
    equip:{weapon:null,armor:null,horseM:null,horseP:null}, judge:[], aff: role==='lord'?10:0, flash:0,
  }));
  G = {gameId:'L'+Date.now(), players, deck:buildDeck(), discard:[], log:[], cur:0, turnCount:0, over:false, winner:null, field:null, aborted:false, pool:shuffle([...GENERALS]), started:false, level:'normal'};
  return G;
}
function assignGeneral(p, gen){
  p.gen=gen; G.pool=G.pool.filter(g=>g!==gen);
  p.maxHp=gen.hp + (p.role==='lord'?1:0) + (p.isHuman?0:(LV(p).hp||0)); p.hp=p.maxHp;
}
async function runGame(humanSeat, level='normal', seat0lv=null){
  const seats = Array.isArray(humanSeat) ? humanSeat : null;
  setupGame(seats ? -1 : humanSeat); G.level=level; if(seat0lv) G.players[0].lv=seat0lv;
  if(seats) for(const s of seats) G.players[s].isHuman=true;
  const humans = G.players.filter(p=>p.isHuman);
  if(humans.length){
    const per = humans.length>3 ? 2 : 3;
    const picks = await Promise.all(humans.map((h,i)=>humanInput({mode:'general', options:G.pool.slice(i*per, i*per+per)}, h)));
    humans.forEach((h,i)=>assignGeneral(h, picks[i]));
  }
  for(const p of G.players) if(!p.gen) assignGeneral(p, G.pool[0]);
  for(const p of G.players) draw(p, 4 + (p.isHuman ? 0 : LV(p).extra));
  G.started=true;
  G.cur = G.players.findIndex(p=>p.role==='lord');
  const lord=G.players[G.cur];
  log(`天下人は${lord.isHuman&&!NET?'あなた':''}【${lord.gen.name}】。合戦開始!`, 'big');
  if(NET){ NET.fx('opening',[]); await wait(2900); fxBanner('合戦開始','big'); await wait(1100); }
  else if(!HEADLESS){ Music.horn(); const me=G.players.find(p=>p.isHuman); if(me) { fxCutin(me.gen); await wait(UI.speed>500?2900:2000); } fxBanner('合戦開始','big'); await wait(1100); }
  try{
    for(let guard=0; guard<600; guard++){
      const p=G.players[G.cur];
      if(p.alive) await playTurn(p);
      do { G.cur=(G.cur+1)%G.players.length; } while(!G.players[G.cur].alive);
    }
    G.over=true; G.winner='draw';
  }catch(e){
    if(!(e instanceof Stop)) throw e;
    if(e.kind==='abort') return null;
  }
  if(!HEADLESS && !NET) recordResult();
  render(); return G.winner;
}

function fanHtml(n){

}

  el.innerHTML=`<div class="ph"></div><b>スマホを横向きにしてください</b><p>横向きにすると、卓全体と手札が一画面に収まって遊びやすくなります。画面が回らないときは、本体の画面の向きのロックを外すか、ブラウザで開いてください。</p><button class="btn ghost" data-rot="close">縦のまま遊ぶ</button>`;
  document.body.appendChild(el);
  const close=()=>{ el.remove(); mq.removeEventListener && mq.removeEventListener('change',onChange); };
  const mq=matchMedia('(orientation:landscape)'); const onChange=e=>{ if(e.matches) close(); };
  mq.addEventListener && mq.addEventListener('change',onChange);
  el.querySelector('[data-rot]').addEventListener('click', close);
}


/* ===================== 友達と対戦(サーバーに置いたときだけ使う) ===================== */
const NETC = (()=>{
  const ON = !HEADLESS && typeof window!=='undefined' && !!window.__SERVER__;
  const esc = t => String(t??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const st = { active:false, ws:null, room:null, you:null, host:false, members:[], phase:'lobby', level:'normal', speed:650, overShown:null, gameId:0, retry:0, closing:false, lastErr:'' };
  const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
  const GEN = id => GENERALS.find(g=>g.id===id);
  function send(o){ if(st.ws && st.ws.readyState===1) st.ws.send(JSON.stringify(o)); }
  function connect(first){
    return new Promise((res,rej)=>{
      const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
      const ws=new WebSocket(url); st.ws=ws;
      ws.onopen=()=>{ st.retry=0; send(first); res(); clearInterval(st.hb); st.hb=setInterval(()=>send({t:'hb'}), 240000); };
      ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; } onMsg(m); };
      ws.onclose=()=>{ if(st.ws!==ws) return; st.ws=null; if(st.closing || !st.room){ return; }
        st.retry++; if(st.retry<=20) setTimeout(()=>connect({t:'join', room:st.room, name:ls.get('tb-name')||'', token:ls.get('tb-token-'+st.room)}).catch(()=>{}), Math.min(5000, 600*st.retry));
        lobbyNote('通信が切れました。つなぎ直しています…'); };
      ws.onerror=()=>rej(new Error('接続できませんでした'));
    });
  }
  function onMsg(m){
    if(m.t==='joined'){ st.active=true; st.room=m.room; st.you=m.seat; ls.set('tb-token-'+m.room, m.token);
      try{ history.replaceState(null,'', location.pathname+'?room='+m.room); }catch(_){}
      st.lastErr=''; return; }
    if(m.t==='lobby'){ st.members=m.members; st.host=m.host===st.you; st.phase=m.phase; st.level=m.level; st.speed=m.speed;
      if(m.phase!=='playing' || !G || !G.started) showLobby(); return; }
    if(m.t==='error'){ st.lastErr=m.msg; lobbyNote(m.msg); if(m.fatal){ st.closing=true; try{ st.ws&&st.ws.close(); }catch(_){} st.room=null; st.active=false; } return; }
    if(m.t==='state'){ hydrate(m); return; }
    if(m.t==='fx'){ onFx(m.name, m.args); return; }
  }
  function hydrate(m){
    const s=m.s; const players=s.players.map(p=>Object.assign({}, p, {gen: p.gen?GEN(p.gen):null}));
    const P=x=>x==null?null:players[x];
    const prevGame=G&&G.gameId;
    G = { players, deck:{length:s.deckN}, discard:{length:s.discardN}, log:s.log, cur:s.cur, turnCount:s.turnCount, over:s.over, winner:s.winner,
      field: s.field ? {card:s.field.card, from:P(s.field.from), to:P(s.field.to), note:s.field.note} : null,
      aborted:false, started:s.started, level:s.level, harvest:s.harvest, gameId:s.gameId, pool:[], resultShown: st.overShown===s.gameId };
    st.gameId=s.gameId;
    if(s.started && $modal.dataset.kind==='netlobby') closeModal();
    if(s.started && prevGame!==s.gameId){ UI.onTitle=false; Music.mode('battle'); }
    const r=m.req;
    if(r){
      if(!UI.pending || UI.pending.rid!==r.rid){
        const spec={mode:r.mode};
        if(r.mode==='pick'){ Object.assign(spec,{prompt:r.prompt, sub:r.sub, pass:r.pass, urgent:r.urgent}); const allow=new Set(r.allow); spec.filter=c=>allow.has(c.id); }
        if(r.mode==='discard') spec.n=r.n;
        if(r.mode==='general') spec.options=r.options.map(GEN);
        if(r.mode==='zone'){ spec.target=P(r.target); spec.verb=r.verb; }
        if(r.mode==='victim'){ spec.a=P(r.a); spec.options=r.options.map(P); }
        if(r.mode==='harvest') spec.pool=r.pool;
        if($modal.dataset.kind && ['general','zone','victim','harvest'].includes($modal.dataset.kind)) closeModal();
        UI.selected=null; UI.discardSel=new Set();
        UI.pending={ rid:r.rid, spec, resolve:val=>answer(r.rid, spec, val), reject:()=>{} };
      } else {
        // 同じ問いのまま、表示用の対象だけ最新の盤面に付け替える
        const sp=UI.pending.spec; if(r.mode==='zone') sp.target=P(r.target); if(r.mode==='victim'){ sp.a=P(r.a); sp.options=r.options.map(P); }
        if(UI.selected) UI.selected = G.players[st.you].hand.find(c=>c.id===UI.selected.id) || null;
        if(UI.discardSel.size){ const ids=new Set([...UI.discardSel].map(c=>c.id)); UI.discardSel=new Set(G.players[st.you].hand.filter(c=>ids.has(c.id))); }
      }
    } else if(UI.pending){ UI.pending=null; UI.selected=null; UI.discardSel=new Set();
      if($modal.dataset.kind && ['general','zone','victim','harvest'].includes($modal.dataset.kind)) closeModal(); }
    render();
  }
  function answer(rid, spec, val){
    let v=val;
    if(spec.mode==='action') v = val.type==='end' ? {type:'end'} : {type:'play', cardId:val.card.id, target: val.target?val.target.seat:null, asKey:val.asKey||null};
    else if(spec.mode==='pick') v = val ? val.id : null;
    else if(spec.mode==='discard') v = val.map(c=>c.id);
    else if(spec.mode==='general') v = val.id;
    else if(spec.mode==='victim') v = val.seat;
    else if(spec.mode==='harvest') v = val.id;
    send({t:'answer', rid, val:v});
  }
  function onFx(name, a){
    if(!G || !G.players) return; const P=s=>G.players[s];
    try{
      switch(name){
        case 'sfx': sfx[a[0]] && sfx[a[0]](); break;
        case 'fly': fxFly(a[0], a[1]==null?null:P(a[1])); break;
        case 'float': fxFloat(P(a[0]),a[1],a[2]); break;
        case 'slash': fxSlash(P(a[0])); break;
        case 'shake': if(a[0]===st.you) fxShake(); break;
        case 'banner': fxBanner(a[0],a[1]); break;
        case 'turn': { const mine=a[0]===st.you; sfx.turn(); fxBanner(mine?'あなたの手番':`${P(a[0]).gen.name}の手番`, mine?'mine':''); break; }
        case 'deal': fxDeal(P(a[0]),a[1]); break;
        case 'say': fxSay(P(a[0]),a[1],a[2]); break;
        case 'opening': { Music.horn(); const me=P(st.you); if(me&&me.gen) fxCutin(me.gen); break; }
      }
    }catch(e){}
  }
  // ── ロビー(待合室) ──
  function lobbyNote(t){ const el=document.getElementById('lobby-note'); if(el) el.textContent=t; }
  function showLobby(){
    const name=ls.get('tb-name')||'';
    const q=new URLSearchParams(location.search).get('room')||'';
    let body;
    if(!st.active){
      body=`
        <p class="lead">部屋を作って友達を招待するか、友達から聞いた合言葉で参加します。空いた席にはCPUが入ります(最大5人)。</p>
        <label class="nf"><span>あなたの名前</span><input id="net-name" maxlength="10" value="${esc(name)}" placeholder="例:大聖" autocomplete="nickname"></label>
        <div class="netrow">
          <button class="btn" data-net="create">部屋を作る</button>
          <span class="or">または</span>
          <input id="net-code" maxlength="4" value="${esc(q)}" placeholder="合言葉" autocapitalize="characters" autocomplete="off">
          <button class="btn ghost" data-net="join">参加する</button>
        </div>`;
    } else {
      const link=location.origin+location.pathname+'?room='+st.room;
      const seats=[0,1,2,3,4].map(i=>{ const m=st.members.find(x=>x.seat===i);
        return `<li class="${m?'':'cpu'} ${m&&!m.connected?'off':''}"><span class="sn">${i+1}</span>${m?`<b>${esc(m.name)}</b>${m.seat===st.you?'<em>あなた</em>':''}${m.host?'<em class="h">ホスト</em>':''}${m.connected?'':'<em>通信切れ</em>'}`:'<span>空席(CPU)</span>'}</li>`; }).join('');
      const playing = st.phase==='playing';
      body=`
        <div class="code"><span>合言葉</span><b>${esc(st.room)}</b></div>
        <div class="share"><input id="net-link" readonly value="${esc(link)}"><button class="btn ghost" data-net="copy">招待リンクをコピー</button></div>
        <p class="lead">このリンクをLINEなどで送ると、友達がそのまま参加できます。</p>
        <ol class="seats">${seats}</ol>
        ${st.host ? `
          <div class="levels" role="radiogroup" aria-label="CPUの強さ">${Object.entries(LEVELS).map(([k,l])=>`<button class="lvl ${st.level===k?'on':''}" data-netlv="${k}"><b>${l.name}</b><small>${l.sub}</small></button>`).join('')}</div>
          <div class="netrow"><button class="btn" data-net="start" ${playing?'disabled':''}>${playing?'対戦中…':'この顔ぶれで出陣する'}</button><button class="btn ghost" data-net="leave">部屋を出る</button></div>`
        : `<p class="lead">${playing?'対戦中です。':'ホストが出陣するのを待っています…'}</p><div class="netrow"><button class="btn ghost" data-net="leave">部屋を出る</button></div>`}`;
    }
    showModal('netlobby', `<h2>友達と遊ぶ</h2><div class="netlobby">${body}<p class="stats" id="lobby-note">${esc(st.lastErr)}</p></div>`, true);
  }
  async function create(){ const n=(document.getElementById('net-name').value||'').trim().slice(0,10); if(!n) return lobbyNote('名前を入れてください。'); ls.set('tb-name',n);
    lobbyNote('部屋を作っています…'); try{ await connect({t:'create', name:n}); }catch(e){ lobbyNote('サーバーにつながりませんでした。少し待ってからもう一度押してください。'); } }
  async function join(){ const n=(document.getElementById('net-name').value||'').trim().slice(0,10); const c=(document.getElementById('net-code').value||'').trim().toUpperCase();
    if(!n) return lobbyNote('名前を入れてください。'); if(!/^[A-Z]{4}$/.test(c)) return lobbyNote('合言葉は英字4文字です。'); ls.set('tb-name',n);
    lobbyNote('参加しています…'); try{ await connect({t:'join', room:c, name:n, token:ls.get('tb-token-'+c)}); }catch(e){ lobbyNote('サーバーにつながりませんでした。'); } }
  function leave(){ st.closing=true; send({t:'leave'}); try{ st.ws&&st.ws.close(); }catch(_){} Object.assign(st,{active:false, room:null, you:null, members:[], closing:false});
    try{ history.replaceState(null,'',location.pathname); }catch(_){}
    if(G && G.started && !G.over){ /* 対戦の途中で抜けたら、タイトルへ */ }
    setupGame(0); G.players.forEach((p,i)=>{ assignGeneral(p, GENERALS[i*2]); draw(p,4); }); UI.pending=null; render(); openTitle(); }
  function click(e){
    const b=e.target.closest('[data-net],[data-netlv]'); if(!b) return false;
    if(b.dataset.netlv){ send({t:'config', level:b.dataset.netlv}); return true; }
    const a=b.dataset.net;
    if(a==='open'){ ac(); showLobby(); }
    else if(a==='create') create();
    else if(a==='join') join();
    else if(a==='start') send({t:'start'});
    else if(a==='leave') leave();
    else if(a==='copy'){ const el=document.getElementById('net-link'); const done=()=>{ b.textContent='コピーしました'; };
      try{ navigator.clipboard.writeText(el.value).then(done,()=>{ el.select(); b.textContent='選択しました'; }); }catch(_){ el.select(); } }
    return true;
  }
  function restart(){ if(st.host){ closeModal(); send({t:'start'}); } else { showLobby(); lobbyNote('次の合戦はホストが始めます。'); } }
  function boot(){ if(!ON) return; const q=new URLSearchParams(location.search).get('room'); if(q){ const tok=ls.get('tb-token-'+q.toUpperCase()); if(tok && ls.get('tb-name')){ connect({t:'join', room:q.toUpperCase(), name:ls.get('tb-name'), token:tok}).catch(()=>showLobby()); } else showLobby(); } }
  return { ON, get active(){ return st.active; }, get you(){ return st.you; }, click, restart, boot, showLobby, markOver(){ st.overShown=st.gameId; } };
})();

function openRules(){

  const gens = GENERALS.map(g=>`<tr><td>${g.name}(${g.hp})</td><td>【${g.skill}】${g.sdesc}</td></tr>`).join('');
  showModal('rules', `

    <div class="rules">
      <p>5人の武将が身分を隠して戦います。最初から正体がわかっているのは天下人だけ。誰が味方で誰が敵かは、「誰を攻撃したか」「誰を薬で救ったか」から見抜いてください。</p>
